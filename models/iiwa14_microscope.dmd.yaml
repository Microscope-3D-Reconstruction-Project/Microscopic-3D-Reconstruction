directives:
- add_model:
    name: iiwa
    file: package://drake_models/iiwa_description/urdf/iiwa14_spheres_dense_collision.urdf
    default_joint_positions:
        iiwa_joint_1: [0]
        iiwa_joint_2: [0.1]
        iiwa_joint_3: [0]
        iiwa_joint_4: [-1.2]
        iiwa_joint_5: [0]
        iiwa_joint_6: [1.6]
        iiwa_joint_7: [0]
- add_weld:
    parent: world
    child: iiwa::iiwa_link_0
- add_model:
    name: microscope_mount
    file: package://iiwa_setup/microscope_mount.sdf
- add_weld:
    parent: iiwa::iiwa_link_ee_kuka
    child: microscope_mount::microscope_link
    X_PC:
        translation: [0, 0, 0.007] # Set microscope tip location here
        rotation: !Rpy { deg: [0, 180, 180] }  # Roll, Pitch, Yaw in degrees
- add_model:
    name: camera_optical_center
    file: package://iiwa_setup/camera_optical_center.sdf
- add_weld:
    parent: iiwa::iiwa_link_ee_kuka
    child: camera_optical_center::optical_center
    # X_PC = T_cam_to_flange from eye-in-hand calibration (translation in metres).
    # Rerun microscope_scripts/eye_in_hand_calibration.py and paste new values here.
    X_PC:
        translation: [-0.056947, -0.054765, 0.077463]
        rotation: !Rpy { deg: [1.6155, 0.6423, -90.4315] }
