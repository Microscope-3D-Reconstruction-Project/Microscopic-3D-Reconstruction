# ── Pipeline flags ────────────────────────────────────────────────────────────
random_seed: 1

# ── Stage toggles (can also be driven by pipeline.yaml) ───────────────────────
run:
  colmap_feat_extract_match: true
  colmap_reconstruct: true

# ── Experiment ────────────────────────────────────────────────────────────────
output_dir: outputs
experiment_name: ${now:%Y-%m-%d_%H-%M-%S}

# ── Source data ───────────────────────────────────────────────────────────────
source_data_dir: ${output_dir}/${experiment_name}

# ── Feature extraction / matching ─────────────────────────────────────────────
feat_extract_match:
  input_paths:
    images_path: ${...source_data_dir}/images
    masks_path: ${...source_data_dir}/masks
  output_paths:
    dir: ${output_dir}/${experiment_name}
    database_filename: database.db
  extraction:
    device: cuda
    camera_model: OPENCV
    num_threads: 1
    max_num_features: 8192
    estimate_affine_shape: true
  matching:
    use_gpu: true
    num_threads: 1
    guided_matching: true

# ── Reconstruction ────────────────────────────────────────────────────────────
reconstruction:
  mode: triangulate          # triangulate | automatic
  load_prior_poses: false    # automatic mode only: use known robot poses as prior
  input_paths:
    images_path: ${...feat_extract_match.input_paths.images_path}
    database_path: ${...feat_extract_match.output_paths.dir}/${...feat_extract_match.output_paths.database_filename}
  output_paths:
    dir: ${output_dir}/${experiment_name}
    model_name: sparse_model
  mapping_params:
    min_focal_length_ratio: 0.1
    max_focal_length_ratio: 10.0
    max_extra_param: .inf
    ba_local_max_num_iterations: 30
    ba_local_max_refinements: 3
    ba_global_max_num_iterations: 75
    ba_use_gpu: true
    num_threads: 1

# ── Hydra internal settings ───────────────────────────────────────────────────
hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/${experiment_name}
  output_subdir: .hydra
