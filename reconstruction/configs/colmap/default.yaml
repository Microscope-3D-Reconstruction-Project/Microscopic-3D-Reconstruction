# ── Pipeline ───────────────────────────────────────────────────────────────────
# Top-level flags that control the overall COLMAP pipeline
mode: triangulate          # triangulate | automatic
random_seed: 1
load_prior_poses: false    # automatic mode only: use known robot poses as prior
rebuild_database: false    # delete and re-extract features even if DB exists

# ── Paths ──────────────────────────────────────────────────────────────────────
paths:
  dataset: /home/codaero/Projects/Microscopic-3D-Reconstruction/microscope-data/scans/20260401_205638
  images_subdir: images
  colmap_subdir: colmap
  masks_subdir: masks
  database_filename: database.db
  # workspace_dir is always colmap_subdir/mode — derived, not configurable
  # (keeps triangulate and automatic runs in separate directories)

# ── Feature Extraction ─────────────────────────────────────────────────────────
extraction:
  device: cuda
  camera_model: OPENCV
  num_threads: 1
  max_num_features: 8192
  estimate_affine_shape: true

# ── Feature Matching ───────────────────────────────────────────────────────────
matching:
  use_gpu: true
  num_threads: 1
  guided_matching: true

# ── Mapping / Triangulation ────────────────────────────────────────────────────
mapping:
  min_focal_length_ratio: 0.1
  max_focal_length_ratio: 10.0
  max_extra_param: .inf
  ba_local_max_num_iterations: 30
  ba_local_max_refinements: 3
  ba_global_max_num_iterations: 75
  ba_use_gpu: true
  num_threads: 1

# ── Hydra internal settings ────────────────────────────────────────────────────
hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: .hydra
