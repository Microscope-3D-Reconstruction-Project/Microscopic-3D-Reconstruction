# @package _global_
# Pipeline-level experiment preset for the 20260413_211810_flower dataset.
# Usage: python run_pipeline.py "+experiment=flower_mcmc"

defaults:
  - override /gsplat: mcmc

dataset_dir: ../microscope-data/scans/20260413_211810_flower
experiment_name: 20260413_211810_flower

# ── COLMAP ────────────────────────────────────────────────────────────────────
colmap:
  reconstruction:
    mode: automatic

# ── GSplat ────────────────────────────────────────────────────────────────────
gsplat:
  disable_viewer: true
  max_steps: 30000
  data_factor: 1
