defaults:
  - _self_

random_seed: 0

# ── Viewer ─────────────────────────────────────────────────────────────────────
disable_viewer: false

# ── Checkpoint / export ────────────────────────────────────────────────────────
ckpt: null
compression: null          # "png" or null
render_traj_path: interp   # "interp" | "ellipse" | "spiral"
render_traj_trim: 5        # frames to drop from each end before path generation; null to disable

# ── Experiment ─────────────────────────────────────────────────────────────────
output_dir: outputs
experiment_name: ${now:%Y-%m-%d_%H-%M-%S}

# ── Input / output paths ───────────────────────────────────────────────────────
input_paths:
  model_dir:  ${output_dir}/${experiment_name}/sparse_model
  images_dir: ${output_dir}/${experiment_name}/focus_stacked_images
  masks_dir:  ${output_dir}/${experiment_name}/masks

output_paths:
  splat_dir: ${output_dir}/${experiment_name}/gs_2d

# ── Data ───────────────────────────────────────────────────────────────────────
data_factor: 4
test_every: 8
patch_size: null
global_scale: 1.0
normalize_world_space: true
camera_model: pinhole

# ── Viewer server ──────────────────────────────────────────────────────────────
port: 8080

# ── Training ───────────────────────────────────────────────────────────────────
batch_size: 1
steps_scaler: 1.0
max_steps: 30000
eval_steps: [7000, 30000]
save_steps: [7000, 30000]
save_ply: true
ply_steps: [7000, 30000]
disable_video: false

# ── Gaussian initialization ────────────────────────────────────────────────────
init_type: sfm
init_num_pts: 100000
init_extent: 3.0
sh_degree: 3
sh_degree_interval: 1000
init_opa: 0.1
init_scale: 1.0
ssim_lambda: 0.2
model_type: 2dgs

# ── Clipping planes ────────────────────────────────────────────────────────────
near_plane: 0.2
far_plane: 200

# ── Rasterization ──────────────────────────────────────────────────────────────
packed: false
sparse_grad: false
absgrad: false
antialiased: false
revised_opacity: false
random_bkgd: false

# ── Pruning ───────────────────────────────────────────────────────────
prune_opa: 0.05           # GSs with opacity below this value will be pruned
grow_grad2d: 0.0002       # GSs with image plane gradient above this value will be split/duplicated
grow_scale3d: 0.01        # GSs with scale below this value will be duplicated. Above will be split
prune_scale3d: 0.1        # GSs with scale above this value will be pruned.

# ── Strategy Refinement ───────────────────────────────────────────────────────────
refine_start_iter: 500      # Start refining GSs after this iteration
refine_stop_iter: 15000    # Stop refining GSs after this iteration
reset_every: 3000           # Reset opacities every this steps
refine_every: 100           # Refine GSs every this steps

# ── Learning rates ─────────────────────────────────────────────────────────────
# means_lr: 1.6e-4
# scales_lr: 5.0e-3
# opacities_lr: 5.0e-2
# quats_lr: 1.0e-3
# sh0_lr: 2.5e-3
# shN_lr: 1.25e-4

# ── Pose / camera optimisation ────────────────────────────────────────────────
pose_opt: false
pose_opt_lr: 1.0e-5
pose_opt_reg: 1.0e-6
pose_noise: 0.0

# ── Appearance optimisation ───────────────────────────────────────────────────
app_opt: false
app_embed_dim: 16
app_opt_lr: 1.0e-3
app_opt_reg: 1.0e-6

# ── Depth loss ─────────────────────────────────────────────────────────────────
depth_loss: false
depth_lambda: 0.01

# ── Background Alpha Loss ─────────────────────────────────────────────────────
bg_alpha_loss: true
bg_alpha_lambda: 0.5

# ── Normal consistency loss ─────────────────────────────────────────────────────
normal_loss: false         # Enable normal consistency loss. (Currently for 2DGS only)
normal_lambda: 5e-2       # Weight for normal loss
normal_start_iter: 7000    # Iteration to start normal consistency regulerization
  
# ── Distortion Loss ─────────────────────────────────────────────────────────
dist_loss: false           # Enable distortion loss. (experimental)
dist_lambda: 1e-2         # Weight for distortion loss
dist_start_iter: 3000      # Iteration to start distortion loss regularization

# ── Tensorboard ────────────────────────────────────────────────────────────────
tb_every: 100
tb_save_image: false

# ── Hydra internal settings ───────────────────────────────────────────────────
hydra:
  job:
    chdir: false
  run:
    dir: outputs/hydra/${now:%Y-%m-%d_%H-%M-%S}
  output_subdir: .hydra
