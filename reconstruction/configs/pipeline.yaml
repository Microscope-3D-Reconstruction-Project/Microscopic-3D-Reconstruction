defaults:
  - focus_stack: default
  - colmap: default
  - gs_3d: default
  - gs_2d: default
  - _self_

# ── Experiment ────────────────────────────────────────────────────────────────
output_dir: outputs
experiment_name: ${now:%Y-%m-%d_%H-%M-%S}

random_seed: 0

# ── Dataset ──────────────────────────────────────────────────────────────────
dataset_dir: ???              # required: directory containing scan subdirs

# ── Stage toggles ─────────────────────────────────────────────────────────────
run:
  focus_stack: true
  colmap_feat_extract_match: true
  colmap_reconstruct: true
  splatting_method: gs_3d # choice of gs_3d, gs_2d, or null which will not run splatting

# ── Wire experiment dir into focus_stack ─────────────────────────────────────
focus_stack:
  dataset_dir: ${dataset_dir}
  output_dir: ${output_dir}
  experiment_name: ${experiment_name}
  random_seed: ${random_seed} # focus stacking should already be deterministic but keeping as a placeholder just in case additional changes are made

# ── Wire experiment dir into colmap ───────────────────────────────────────────
colmap:
  output_dir: ${output_dir}
  experiment_name: ${experiment_name}
  random_seed: ${random_seed}
  run:
    colmap_feat_extract_match: ${run.colmap_feat_extract_match}
    colmap_reconstruct: ${run.colmap_reconstruct}

# ── Wire experiment context into GS methods ──────────────────────────────────
# input_paths and output_paths resolve automatically via interpolations in
# configs/gs_3d/default.yaml once output_dir and experiment_name are set.
gs_3d:
  output_dir: ${output_dir}
  experiment_name: ${experiment_name}
  random_seed: ${random_seed}

gs_2d:
  output_dir: ${output_dir}
  experiment_name: ${experiment_name}
  random_seed: ${random_seed}

# ── Hydra internal settings ───────────────────────────────────────────────────
hydra:
  job:
    chdir: false
  run:
    dir: ${output_dir}/${experiment_name}
  output_subdir: .hydra
